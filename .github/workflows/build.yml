name: Build Dead's Mod Requiem v3.3 (Forge 1.16.5)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: JDK 21 for offline ASM patcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Retrieve original user-provided mod from release (not public source tree)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download original-input-v1 --repo "${{ github.repository }}" --pattern original.jar --dir .
          echo 'a933c66ce2fd8b34d6287a96144f07fc0718c76c899271f6aedb542a044389fa  original.jar' | sha256sum -c -
      - name: Generate two compass models and real-structure contour meshes
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/generate_compass_assets.py
          python3 tools/structure_mesh.py --build original.jar src/main/resources/assets/horrormod/requiem
      - name: Compile Java 8 hooks and patcher
        run: |
          set -euo pipefail
          mkdir -p build/classes build/patcher-classes build/test-classes
          javac --release 8 -encoding UTF-8 -d build/classes $(find src/main/java tests/stubs -name '*.java')
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED -encoding UTF-8 -d build/patcher-classes tools/PatchJar.java
      - name: Test placement, safe spawn, compass mode and persistence
        run: |
          set -euo pipefail
          javac --release 8 -encoding UTF-8 -cp build/classes -d build/test-classes tests/TestPolicy.java tests/RepairSmokeTest.java tests/CompassV3SmokeTest.java tests/OutlineV32SmokeTest.java tests/SurfaceV33Test.java
          java -cp build/classes:build/test-classes TestPolicy
          java -cp build/classes:build/test-classes RepairSmokeTest
          java -cp build/classes:build/test-classes CompassV3SmokeTest
          java -cp build/classes:build/test-classes:src/main/resources OutlineV32SmokeTest
          java -cp build/classes:build/test-classes SurfaceV33Test
          python3 tests/validate_dimension_v33.py
      - name: Patch and verify JAR
        run: |
          set -euo pipefail
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED -cp build/patcher-classes PatchJar original.jar build/classes build/DeadsMod-Requiem-v3.3-Forge-1.16.5.jar
          jar tf build/DeadsMod-Requiem-v3.3-Forge-1.16.5.jar | grep -q 'net/mcreator/horrormod/unified/ClientOutline.class'
          jar tf build/DeadsMod-Requiem-v3.3-Forge-1.16.5.jar | grep -q 'assets/minecraft/models/item/compass.json'
          unzip -tq build/DeadsMod-Requiem-v3.3-Forge-1.16.5.jar | tail -2
          sha256sum build/DeadsMod-Requiem-v3.3-Forge-1.16.5.jar
      - name: Reconstruct original Java classes using CFR
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar -o build/cfr.jar
          mkdir -p build/decompiled-original
          java -Xmx3G -jar build/cfr.jar original.jar --outputdir build/decompiled-original --silent true
          test "$(find build/decompiled-original -name '*.java' | wc -l)" -ge 200
      - name: Bundle patch sources, decompiled original classes and resources
        run: |
          set -euo pipefail
          mkdir -p build/source-bundle
          cp -r src tools tests .github build/source-bundle/
          cp README.md build/source-bundle/
          cp -r build/decompiled-original build/source-bundle/
          cp original.jar build/source-bundle/
          (cd build/source-bundle && zip -qr ../DeadsMod-Requiem-v3.3-Sources.zip .)
      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeadsMod-Requiem-v3.3-build
          path: |
            build/DeadsMod-Requiem-v3.3-Forge-1.16.5.jar
            build/DeadsMod-Requiem-v3.3-Sources.zip
          if-no-files-found: error
          retention-days: 30
